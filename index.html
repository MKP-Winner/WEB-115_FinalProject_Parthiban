<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sarcastic Productivity Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Sarcastic Productivity Tracker</h1>

    <input type="text" id="taskInput" placeholder="Enter a Task">
    <button id="addTaskBtn">Add Task</button>

    <ul id="taskList"></ul>

    <h3 id="progressText">Progress: 0%</h3>

    <h3>Quote Mode</h3>
    <button id="motivationBtn">Motivation</button>
    <button id="sarcasmBtn">Sarcasm</button>
    <button id="randomBtn">Random</button>

    <div id="quoteDisplay">Select a mode to get a quote</div>

    <script src="script.js" defer></script>
</body>
</html>
